<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing Page Builder</title>
<link rel="stylesheet" href="src/admin.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="tb-left">
      <span class="brand">LP&nbsp;Builder</span>
      <button class="btn btn-ghost" id="btn-pages">Pages</button>
      <span class="page-name" id="page-name" title="Rename page"></span>
    </div>
    <div class="tb-center">
      <div class="seg" id="viewport-seg" role="group" aria-label="Viewport">
        <button data-vp="desktop" class="on">Desktop</button>
        <button data-vp="tablet">Tablet</button>
        <button data-vp="mobile">Mobile</button>
      </div>
    </div>
    <div class="tb-right">
      <button class="btn btn-ghost" id="btn-undo" title="Undo (Cmd/Ctrl+Z)">&#8630;</button>
      <button class="btn btn-ghost" id="btn-redo" title="Redo (Cmd/Ctrl+Shift+Z)">&#8631;</button>
      <span class="sep"></span>
      <button class="btn btn-ghost" id="btn-issues"><span id="issues-dot" class="dot"></span>Issues</button>
      <button class="btn btn-ghost" id="btn-json">JSON</button>
      <button class="btn btn-primary" id="btn-export">Export</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel panel-left">
      <div class="panel-head">
        <span>Page structure</span>
        <button class="btn btn-sm btn-primary" id="btn-add">+ Add section</button>
      </div>
      <div class="panel-body" id="outline"></div>
    </aside>

    <section class="stage" id="stage">
      <div class="stage-inner"><iframe id="preview" title="Preview" sandbox="allow-scripts allow-same-origin"></iframe></div>
    </section>

    <aside class="panel panel-right">
      <div class="panel-head"><span id="inspector-title">Inspector</span></div>
      <div class="panel-body" id="inspector"></div>
    </aside>
  </main>
</div>

<div class="modal-root" id="modal-root" hidden></div>
<div class="toast-root" id="toast-root"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
